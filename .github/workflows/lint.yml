name: Auto Linter

on: workflow_dispatch
  # push:
  #   paths: "*.py"
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installing Linter
        run: pip install ruff

      - name: checking the file for linting
        run: ruff check .
      
